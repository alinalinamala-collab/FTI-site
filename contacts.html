<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакти | Студрада ФТІ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main>
        <h1>Контакти та зворотний зв'язок</h1>

        <section class="socials">
        <h2>Офіційні ресурси Студради</h2>
        <ul>
            <li> Telegram-канал: <a href="#">@sr_fti</a></li>
            <li> Telegram-бот зворотного зв'язку: <a href="#">@fti_help_bot</a></li>
            <li> Instagram: <a href="#">@fti_official</a></li>
        </ul>
        </section>

        <section class="feedback-form">
        <h2>Написати нам (Форма зворотного зв'язку)</h2>
        <form>
            <label for="contact-name">Ваше ім'я:</label><br>
            <input type="text" id="contact-name"><br><br>

            <label for="message">Повідомлення / Питання / Пропозиція:</label><br>
            <textarea id="message" rows="5" required></textarea><br><br>

            <button type="submit">Надіслати</button>
        </form>
        </section>
    </main>

    <div id="footer-placeholder"></div>
 <script src="js/main.js"></script>
</body>
</html>
