<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Івенти | Студрада ФТІ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main>
        <h1>Заходи та події</h1>

        <section class="upcoming-events">
        <h2>Анонси найближчих подій</h2>
        <div class="event-card">
            <h3>АбіFest ФТІ 2026</h3>
            <p><strong>Дата:</strong> Незабаром</p>
            <p>Головний захід для знайомства абітурієнтів з інститутом, викладачами та студентами.</p>
            <button type="button">Зареєструватися</button>
        </div>
        </section>

        <section class="event-registration">
        <h2>Форма реєстрації на івент</h2>
        <form>
            <label for="name">Ім'я та Прізвище:</label><br>
            <input type="text" id="name" required><br><br>
        
            <label for="group">Група / Курс:</label><br>
            <input type="text" id="group" required><br><br>

        <button type="submit">Надіслати заявку</button>
        </form>
        </section>

        <section class="past-events">
        <h2>Архів подій</h2>
        <p>Перегляд минулих заходів, хакатонів та кіновечорів.</p>
        </section>
     </main>

    <div id="footer-placeholder"></div>
    <script src="js/main.js"></script>

</body>
</html>
